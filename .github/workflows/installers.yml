name: Installers

# Runs install.sh and install.ps1 against this fork's releases through the three paths the
# installers document: the default source (no override), an explicit NEOVAIN_VERSION pin, and the
# NEOVAIN_REPO override, then makes a real edit with the installed binary.
on:
  pull_request:
    paths: ["install.sh", "install.ps1", ".github/workflows/installers.yml"]
  push:
    branches: [main]
    paths: ["install.sh", "install.ps1", ".github/workflows/installers.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix:
    name: install.sh (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install neovain and Neovim into an empty directory
        env:
          NEOVAIN_INSTALL_NVIM: "yes"
          # No override here on purpose: the default path must resolve this fork's own releases.
          NEOVAIN_INSTALL_DIR: ${{ runner.temp }}/bin
          NEOVAIN_NVIM_DIR: ${{ runner.temp }}/opt
        run: |
          # Hide any Neovim the runner already has, so the install path is what gets tested.
          hidden="$(command -v nvim || true)"
          if [ -n "$hidden" ]; then sudo mv "$hidden" "$hidden.hidden"; fi
          sh install.sh
      - name: Edit a file
        run: |
          export PATH="${{ runner.temp }}/bin:$PATH"
          neovain --version
          printf 'alpha\nbeta\n' > t.txt
          neovain t.txt '@^beta' 'ciwgamma<Esc>'
          grep -qx gamma t.txt
      - name: Install an explicit release with NEOVAIN_VERSION
        env:
          GH_TOKEN: ${{ github.token }}
          NEOVAIN_INSTALL_NVIM: "no"
          NEOVAIN_INSTALL_DIR: ${{ runner.temp }}/bin-pinned
        run: |
          tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          test -n "$tag" && test "$tag" != "null"
          echo "pinning NEOVAIN_VERSION=$tag"
          NEOVAIN_VERSION="$tag" sh install.sh
          got="$("${{ runner.temp }}/bin-pinned/neovain" --version)"
          test "$got" = "neovain ${tag#v}"
      - name: The override resolves another repository
        env:
          GH_TOKEN: ${{ github.token }}
          NEOVAIN_INSTALL_NVIM: "no"
          # v0.1.0 exists upstream and not here, so this only passes if the override took effect.
          NEOVAIN_REPO: kbrock84/neovain
          NEOVAIN_VERSION: v0.1.0
          NEOVAIN_INSTALL_DIR: ${{ runner.temp }}/bin-override
        run: |
          sh install.sh
          got="$("${{ runner.temp }}/bin-override/neovain" --version)"
          test "$got" = "neovain 0.1.0"
      - name: Declining leaves Neovim uninstalled
        env:
          NEOVAIN_INSTALL_NVIM: "no"
          NEOVAIN_INSTALL_DIR: ${{ runner.temp }}/bin2
          NEOVAIN_NVIM_DIR: ${{ runner.temp }}/opt2
        run: |
          sh install.sh
          test -x "${{ runner.temp }}/bin2/neovain"
          test ! -e "${{ runner.temp }}/bin2/nvim"
          test ! -e "${{ runner.temp }}/opt2"

  windows:
    name: install.ps1 (${{ matrix.shell }})
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    runs-on: windows-latest
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - name: Install neovain and Neovim into an empty directory
        env:
          NEOVAIN_INSTALL_NVIM: "yes"
          NEOVAIN_ADD_TO_PATH: "no"
          # No override here on purpose: the default path must resolve this fork's own releases.
          NEOVAIN_INSTALL_DIR: ${{ runner.temp }}\bin
          NEOVAIN_NVIM_DIR: ${{ runner.temp }}\opt
        run: |
          # Hide any Neovim the runner already has, so the install path is what gets tested.
          $env:Path = (($env:Path -split ';') | Where-Object { -not (Test-Path (Join-Path $_ 'nvim.exe')) }) -join ';'
          ./install.ps1
          if (-not (Test-Path "${{ runner.temp }}\opt\nvim-win64\bin\nvim.exe")) { throw 'Neovim was not installed' }
      - name: Edit a file
        run: |
          $env:Path = "${{ runner.temp }}\bin;${{ runner.temp }}\opt\nvim-win64\bin;$env:Path"
          neovain --version
          [IO.File]::WriteAllText("$PWD\t.txt", "alpha`nbeta`n")
          neovain t.txt '@^beta' 'ciwgamma<Esc>'
          if ($LASTEXITCODE -ne 0) { throw 'neovain failed' }
          if (-not (Select-String -Path t.txt -Pattern '^gamma$' -Quiet)) { throw 'the edit did not land' }
      - name: Install an explicit release with NEOVAIN_VERSION
        env:
          GH_TOKEN: ${{ github.token }}
          NEOVAIN_INSTALL_NVIM: "no"
          NEOVAIN_ADD_TO_PATH: "no"
          NEOVAIN_INSTALL_DIR: ${{ runner.temp }}\bin-pinned
        run: |
          $tag = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq .tag_name
          if (-not $tag) { throw 'no release found' }
          Write-Host "pinning NEOVAIN_VERSION=$tag"
          $env:NEOVAIN_VERSION = $tag
          ./install.ps1
          $got = (& "$env:NEOVAIN_INSTALL_DIR\neovain.exe" --version).Trim()
          if ($got -ne "neovain $($tag.TrimStart('v'))") { throw "got '$got'" }
      - name: The override resolves another repository
        env:
          GH_TOKEN: ${{ github.token }}
          NEOVAIN_INSTALL_NVIM: "no"
          NEOVAIN_ADD_TO_PATH: "no"
          # v0.1.0 exists upstream and not here, so this only passes if the override took effect.
          NEOVAIN_REPO: kbrock84/neovain
          NEOVAIN_VERSION: v0.1.0
          NEOVAIN_INSTALL_DIR: ${{ runner.temp }}\bin-override
        run: |
          ./install.ps1
          $got = (& "$env:NEOVAIN_INSTALL_DIR\neovain.exe" --version).Trim()
          if ($got -ne 'neovain 0.1.0') { throw "got '$got'" }
